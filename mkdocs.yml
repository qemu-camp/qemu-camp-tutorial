site_name: QEMU Camp 2026
site_author: GTOC
site_url: https://qemu.gevico.online
repo_name: qemu-camp-tutorial
repo_url: https://github.com/qemu-camp/qemu-camp-tutorial
copyright: Brought to you by <a href="https://github.com/qemu-camp">Gevico Tech Open Community</a>. Available freely under the MIT license.

plugins:
  - md-preview:
      enable: true
      left_title: "Markdown 源码"
      right_title: "渲染输出"

markdown_extensions:
  - admonition
  - footnotes
  - markdown.extensions.def_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.extra
  - pymdownx.inlinehilite
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/man.md
        - includes/authors.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true

theme:
  language: zh
  logo: image/Qemu-logo.png
  favicon: image/Qemu-logo.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to happy mode
      primary: blue
      accent: blue
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
      primary: blue
      accent: blue
  features:
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.tabs
    - content.comments
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
extra_css:
  - plugins/stylesheets/extra.css
  - plugins/stylesheets/enrollment.css
  - plugins/stylesheets/registration-stats.css
  - plugins/stylesheets/leaderboards.css
  - plugins/stylesheets/ppt-slides.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
extra_javascript:
  - plugins/javascripts/toc-collapse.js
  - plugins/javascripts/enrollment.js
  - plugins/javascripts/registration-stats.js
  - plugins/javascripts/ppt-slides.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - plugins/javascripts/katex-config.js
  # mermaid@11.4.1 本地化：bundle 默认从 unpkg.com 懒加载，国内网络不可达导致图表无法渲染。
  # 需先于 bundle 加载以跳过 unpkg 拉取；文件由 scripts/fetch-mermaid.sh 获取，升级时手动替换。
  - plugins/javascripts/mermaid.min.js

